    <style>
      html { background-color: #f8fafc; color-scheme: light; }
      html[data-theme="dark"] { background-color: #0b1220; color-scheme: dark; }
    </style>
    <script>
      // Apply the saved theme before React and its styles load.
      try {
        document.documentElement.dataset.theme =
          JSON.parse(localStorage.getItem("isDarkV3")) === true ? "dark" : "light";
      } catch (error) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
