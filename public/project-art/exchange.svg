<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Exchange Matcher — preferences and destinations</title>
  <desc id="desc">Original conceptual diagram connecting three simulated students and ranked preferences to three destinations. This is an illustration, not a screenshot or actual allocation result.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#F5F7FF"/><stop offset="1" stop-color="#E8EDFB"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#3157E8" opacity=".1"/></pattern>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#233671" flood-opacity=".1"/></filter>
  </defs>
  <rect width="960" height="600" fill="url(#bg)"/>
  <rect width="960" height="600" fill="url(#dots)"/>
  <circle cx="840" cy="60" r="180" fill="white" opacity=".48"/>
  <path d="M40 72V40H72M888 40H920V72M40 528V560H72M888 560H920V528" fill="none" stroke="#3157E8" stroke-opacity=".28" stroke-width="2"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="65" y="85" font-size="13" fill="#5D6F9B" font-weight="700" letter-spacing="2.2">PREFERENCES / STABLE MATCHING</text>
    <text x="65" y="537" font-size="11" fill="#7583A6" letter-spacing="2">EXCHANGE MATCHER / TEAM PROJECT</text>
    <text x="788" y="537" font-size="10" fill="#7583A6" letter-spacing="1">ILLUSTRATION</text>
    <text x="133" y="139" font-size="12" fill="#5D6F9B" font-weight="700" letter-spacing="1.6">STUDENTS</text>
    <text x="647" y="139" font-size="12" fill="#5D6F9B" font-weight="700" letter-spacing="1.6">DESTINATIONS</text>
    <g fill="none" stroke-width="3">
      <path d="M333 204C430 204 530 204 627 204" stroke="#3157E8"/>
      <path d="M333 315C470 315 490 426 627 426" stroke="#5A9C82"/>
      <path d="M333 426C470 426 490 315 627 315" stroke="#A978B5"/>
    </g>
    <g fill="#fff" filter="url(#shadow)">
      <rect x="115" y="166" width="218" height="76" rx="15"/>
      <rect x="115" y="277" width="218" height="76" rx="15"/>
      <rect x="115" y="388" width="218" height="76" rx="15"/>
      <rect x="627" y="166" width="218" height="76" rx="15"/>
      <rect x="627" y="277" width="218" height="76" rx="15"/>
      <rect x="627" y="388" width="218" height="76" rx="15"/>
    </g>
    <g text-anchor="middle" font-size="17" font-weight="700" fill="white">
      <circle cx="150" cy="204" r="20" fill="#3157E8"/><text x="150" y="210">A</text>
      <circle cx="150" cy="315" r="20" fill="#5A9C82"/><text x="150" y="321">B</text>
      <circle cx="150" cy="426" r="20" fill="#A978B5"/><text x="150" y="432">C</text>
    </g>
    <g font-size="12" font-weight="600" fill="#5D6F9B">
      <text x="186" y="195">RANKED CHOICES</text><text x="186" y="222" fill="#3157E8">01  /  02  /  03</text>
      <text x="186" y="306">RANKED CHOICES</text><text x="186" y="333" fill="#5A9C82">03  /  01  /  02</text>
      <text x="186" y="417">RANKED CHOICES</text><text x="186" y="444" fill="#A978B5">02  /  03  /  01</text>
    </g>
    <g fill="#152149" font-size="17" font-weight="700">
      <text x="653" y="207">DESTINATION 01</text>
      <text x="653" y="318">DESTINATION 02</text>
      <text x="653" y="429">DESTINATION 03</text>
    </g>
    <g fill="#7D8CB4" font-size="11">
      <text x="653" y="226">PREFERENCES + CAPACITY</text>
      <text x="653" y="337">PREFERENCES + CAPACITY</text>
      <text x="653" y="448">PREFERENCES + CAPACITY</text>
    </g>
  </g>
</svg>
