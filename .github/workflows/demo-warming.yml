name: Check original Render demos manually

on:
  workflow_dispatch:

# The real applications now run on Vercel. Keep Render as an idle fallback;
# a manual availability check remains available without burning its free hours.

# No repository access, token permissions, secrets, checkout or third-party actions.
permissions: {}

concurrency:
  group: portfolio-demo-warming
  cancel-in-progress: false

jobs:
  check-demos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Apply the Paris operating window
        id: window
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_CRON: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          read -r paris_date paris_weekday paris_hour < <(
            TZ=Europe/Paris date '+%F %u %H'
          )
          hour=$((10#$paris_hour))
          run_checks='false'

          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            run_checks='true'
            reason='Manual availability check.'
          elif [[ "$TRIGGER_CRON" == '7,17,27,37,47,57 9-17 * * 1-5' ]]; then
            # Also reject a delayed regular run that arrives outside the window.
            if (( paris_weekday <= 5 && hour >= 9 && hour < 18 )); then
              run_checks='true'
              reason='Regular weekday window, 09:00-18:00 Europe/Paris.'
            else
              reason='Skipped: delayed regular trigger outside the weekday window.'
            fi
          elif [[ "$TRIGGER_CRON" == '7,17,27,37,47,57 0-8,18-23 14 10 *' ||
                  "$TRIGGER_CRON" == '0 0 14 10 *' ]]; then
            if [[ "$paris_date" == '2026-10-14' ]]; then
              run_checks='true'
              reason='One-day exception: all of 14 October 2026, Europe/Paris.'
            else
              reason='Skipped: the temporary exception applies only on 2026-10-14. No demo requests were made.'
            fi
          else
            reason='Skipped: unknown schedule.'
          fi

          printf 'run_checks=%s\n' "$run_checks" >> "$GITHUB_OUTPUT"
          {
            printf '### Operating window\n\n'
            printf '%s\n\n' "$reason"
            printf 'Paris execution time: %s %02d:xx.\n' "$paris_date" "$hour"
            if [[ "$paris_date" > '2026-10-14' ]]; then
              printf '\nThe one-day exception has expired. Annual cron matches are guarded and cannot send extra nighttime requests.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Request the three known Render demos
        if: steps.window.outputs.run_checks == 'true'
        shell: bash
        run: |
          set -euo pipefail
          report_dir="$(mktemp -d "$RUNNER_TEMP/demo-warming.XXXXXX")"

          check_demo() {
            local name="$1" url="$2" key="$3"
            local attempt metrics status elapsed rc result='FAIL'

            # Lightweight GET only; three bounded attempts allow a cold start.
            # Each attempt is limited to 60 seconds; two 30-second waits maximum.
            for attempt in 1 2 3; do
              if metrics="$(curl \
                --silent --show-error \
                --location --max-redirs 5 \
                --proto '=https' --proto-redir '=https' \
                --connect-timeout 15 --max-time 60 \
                --output /dev/null \
                --write-out '%{http_code}|%{time_total}' \
                "$url")"; then
                rc=0
              else
                rc=$?
              fi
              IFS='|' read -r status elapsed <<< "$metrics"
              status="${status:-000}"
              elapsed="${elapsed:-unknown}"
              printf '%s: attempt %s, HTTP %s, curl %s, %ss\n' \
                "$name" "$attempt" "$status" "$rc" "$elapsed"

              if [[ "$rc" -eq 0 && "$status" =~ ^[23][0-9]{2}$ ]]; then
                result='OK'
                break
              fi
              if [[ "$attempt" -lt 3 ]]; then
                sleep 30
              fi
            done

            printf '| %s | [%s](%s) | %s | %s | %s |\n' \
              "$name" "$url" "$url" "$status" "$attempt" "$result" \
              > "$report_dir/$key.md"
            printf '%s\n' "$result" > "$report_dir/$key.result"
            if [[ "$result" != 'OK' ]]; then
              printf '::error title=Demo unavailable::%s failed after %s attempts (HTTP %s, curl %s).\n' \
                "$name" "$attempt" "$status" "$rc"
            fi
          }

          # Fixed lightweight endpoints; no arbitrary input or GitHub Pages pings.
          check_demo 'Facial attendance' \
            'https://facial-attendance-demo.onrender.com/health' 'facial' &
          facial_pid=$!
          check_demo 'ASL recognition' \
            'https://asl-recognition-demo.onrender.com/health' 'asl' &
          asl_pid=$!
          check_demo 'Car rental' \
            'https://car-rental-client-demo.onrender.com/login' 'rental' &
          rental_pid=$!

          failures=0
          for probe_pid in "$facial_pid" "$asl_pid" "$rental_pid"; do
            if ! wait "$probe_pid"; then
              failures=$((failures + 1))
            fi
          done

          {
            printf '### Portfolio demo availability\n\n'
            printf 'Checked at %s.\n\n' "$(TZ=Europe/Paris date '+%Y-%m-%d %H:%M:%S %Z')"
            printf '| Demo | URL | HTTP | Attempts | Result |\n'
            printf '| --- | --- | --- | --- | --- |\n'
            for key in facial asl rental; do
              if [[ -f "$report_dir/$key.md" ]]; then
                cat "$report_dir/$key.md"
              else
                printf '| %s | - | - | - | Probe error |\n' "$key"
              fi
              if [[ ! -f "$report_dir/$key.result" ]] || \
                [[ "$(cat "$report_dir/$key.result")" != 'OK' ]]; then
                failures=$((failures + 1))
              fi
            done
            printf '\nHTTP availability only; this does not test application features.\n'
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$failures" -gt 0 ]]; then
            exit 1
          fi
