name: Build and deploy portfolio

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node public/demos/data-dashboard/verify_data.cjs
      - run: npm run build:pages
      # Keep the generated Pages branch from triggering a second Vercel build.
      - run: cp vercel.json dist/vercel.json
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
